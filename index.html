<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

    <!-- External CSS -->
    <link rel="stylesheet" href="style7.css?v=004">

    <title>AI Transforms</title>
</head>

<body>

    <!-- Visible Title -->
    <h2 id="title">AI Transforms</h2>

    <!-- Mobile Frame -->
    <div id="mobile-frame">

        <div id="top-bar">
            <button id="modeButton">Mode</button>
            <div id="modeDisplay">Default</div>

        <!-- Bottom Bar -->
        <div id="bottom-bar">

        </div>

    </div>

    <!-- JavaScript -->
    <script type="module" src="main.js"></script>
